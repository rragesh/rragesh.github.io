name: Refresh Medium articles

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: medium-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test the feed parser
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
      - name: Refresh static previews
        run: python scripts/update_medium.py
      - name: Commit changed previews
        id: commit
        run: |
          git add writing.html data/pages/writing.html data/medium-posts.json img/medium/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh Medium article previews"
          git push origin HEAD:master
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Rebuild the published GitHub Pages site
        if: steps.commit.outputs.changed == 'true' && github.repository == 'rragesh/rragesh.github.io'
        env:
          GH_TOKEN: ${{ github.token }}
        # Bot commits do not trigger Pages builds automatically.
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
